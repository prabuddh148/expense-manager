spring.application.name=expense-manager-api

# 'dev' for local PostgreSQL, 'prod' for the deployed database.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
server.error.include-message=always

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# JWT. The secret has no default on purpose - the app refuses to start
# without one rather than falling back to a guessable value.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Google Sign-In. Left blank until you create OAuth client IDs; the
# /api/auth/google endpoint returns 503 while it is unconfigured.
app.google.client-ids=${GOOGLE_CLIENT_IDS:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
