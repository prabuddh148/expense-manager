# Production. Every value comes from the environment - nothing secret
# is committed to the repository.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Managed free-tier Postgres (Neon, Supabase, Render) caps connections hard.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.expensemanager=INFO
