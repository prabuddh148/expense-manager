# Production. Every value comes from the environment - nothing secret
# is committed to the repository.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Managed free-tier Postgres (Neon, Supabase, Render) caps connections hard.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# The keep-awake ping holds the API up around the clock. With Hikari's default of keeping
# the whole pool open, Neon's compute never sees an idle moment, never scales to zero, and
# burns through the free monthly compute quota; once that runs out every query times out.
# Let idle connections close so the database can sleep between real requests.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.expensemanager=INFO
