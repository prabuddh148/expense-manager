spring.application.name=expense-manager-api

# 'dev' for local PostgreSQL, 'prod' for the deployed database.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
server.error.include-message=always

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# JWT. The secret has no default on purpose - the app refuses to start
# without one rather than falling back to a guessable value.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Google Sign-In. Left blank until you create OAuth client IDs; the
# /api/auth/google endpoint returns 503 while it is unconfigured.
app.google.client-ids=${GOOGLE_CLIENT_IDS:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Email for password reset codes, sent through Brevo's HTTP API (SMTP is blocked on
# Render's free plan). MAIL_FROM_EMAIL must be a sender verified in Brevo. With no key,
# /api/auth/forgot-password returns 503 unless MAIL_LOG_ONLY prints the code instead.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:Expense Manager}
app.mail.log-only=${MAIL_LOG_ONLY:false}

# Two scheduled tasks now (keep-awake ping and the token purge); a single-thread pool
# would let a slow purge delay the ping.
spring.task.scheduling.pool.size=2

# Public URL of this service, used only by the keep-awake ping. Render sets
# RENDER_EXTERNAL_URL automatically; left blank locally, which disables the ping.
app.self-url=${RENDER_EXTERNAL_URL:}

# --- Redis response cache -------------------------------------------------------------
# Off by default, so Render and the tests behave exactly as they did without Redis.
# docker-compose sets REDIS_ENABLED=true. Every Redis failure falls back to the database.
app.redis.enabled=${REDIS_ENABLED:false}
app.cache.ttl=${CACHE_TTL:PT10M}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Redis only holds cache entries here, never Spring Data repositories.
spring.data.redis.repositories.enabled=false

# --- Kafka activity events ------------------------------------------------------------
# Off by default for the same reason. docker-compose sets KAFKA_ENABLED=true.
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.activity-topic=${KAFKA_ACTIVITY_TOPIC:expense-manager.activity}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# A broker that is down must not hold a thread for the default 60s.
spring.kafka.producer.properties.max.block.ms=5000
# Consumers are not Java classes of ours, so no __TypeId__ header.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Events are sent off the request thread. Bounded so a dead broker cannot queue forever;
# a rejected send is logged and dropped, the request itself has already succeeded.
spring.task.execution.thread-name-prefix=event-publish-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=1000
