spring.application.name=activity-service
server.port=${PORT:8082}

# Its own database (database-per-service). docker-compose creates it next to the API's.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/activity}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Must be the same secret the expense API signs its access tokens with.
app.jwt.secret=${JWT_SECRET}

# --- Kafka --------------------------------------------------------------------------------
app.kafka.activity-topic=${KAFKA_ACTIVITY_TOPIC:expense-manager.activity}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=activity-service
# A new consumer group starts from the beginning, so no event published before it came up is lost.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer turns a malformed message into a dead-letter record instead of
# an endless poison-pill loop.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.expensemanager.activity.kafka.ActivityEventMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# One thread per partition of the topic.
spring.kafka.listener.concurrency=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
