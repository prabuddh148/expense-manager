# Tests run entirely on in-memory H2 in PostgreSQL mode, so no database credentials are needed.
spring.datasource.url=jdbc:h2:mem:expensemanager;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing-0123456789
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.google.client-ids=
app.cors.allowed-origins=*

logging.level.root=WARN
