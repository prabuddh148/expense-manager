spring.datasource.url=jdbc:h2:mem:activity;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing-0123456789

# No broker in tests: the consumer is exercised by calling it directly.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false

logging.level.root=WARN
